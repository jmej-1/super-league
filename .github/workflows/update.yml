name: Update Super League

on:
  schedule:
    - cron: "7 */3 * * *"        # baseline, every 3 hours
    - cron: "*/20 17-23 * * 0"   # Sunday 12 PM - 7 PM ET
    - cron: "*/20 0-5 * * 1"     # Sunday 7 PM - 1 AM ET (SNF)
    - cron: "*/20 1-4 * * 2"     # Monday night
    - cron: "*/20 1-4 * * 5"     # Thursday night
  workflow_dispatch: {}          # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Pull Sleeper + ESPN, rebuild
        env:
          CI: "1"
        run: bash update.sh
      - name: Commit and push
        run: |
          git config user.name "super-league-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "Auto update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours origin main || git pull --rebase origin main
          git push
