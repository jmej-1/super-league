name: Update Super League

# Every 15 minutes; ci_gate.py lets a run through when an NFL game is on (or about to be), and once an hour otherwise.
# Only the data is committed. Vercel builds the site from it on every push.
on:
  schedule:
    - cron: "4-59/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no game is on"
        default: "1"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Game on?
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python3 ci_gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt
      - name: Pull Sleeper + ESPN, rebuild
        if: steps.gate.outputs.run == '1'
        env:
          CI: "1"
        run: bash update.sh
      - name: Commit the data
        if: steps.gate.outputs.run == '1'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > data/last_auto.txt
          git config user.name "super-league-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "Auto update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
